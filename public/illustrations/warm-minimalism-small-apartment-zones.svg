<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="t d"><title id="t">Warm minimalism studio zoning</title><desc id="d">A diagram showing an unobstructed route between entry, bathroom and window; a useful textile area around the sofa; and a clear daylight zone near the window.</desc><rect width="1000" height="540" fill="#f5f1e9"/><text x="54" y="55" font-family="Arial" font-size="27" fill="#243c33" font-weight="bold">Warmth without clutter</text><text x="54" y="83" font-family="Arial" font-size="15" fill="#58665d">Three zones to protect in a compact studio (illustrative, not to scale)</text><rect x="65" y="120" width="610" height="340" fill="#e3ddcf" stroke="#665e51" stroke-width="10"/><rect x="215" y="112" width="170" height="16" fill="#add6d7"/><text x="232" y="110" font-family="Arial" font-size="13" fill="#27525c">WINDOW</text><rect x="86" y="170" width="230" height="95" rx="9" fill="#a79c84"/><text x="128" y="224" font-family="Arial" font-size="19" fill="#fff">SOFA + THROW</text><rect x="110" y="292" width="170" height="105" rx="18" fill="#ccaf8d" stroke="#92785d" stroke-dasharray="7 5" stroke-width="3"/><text x="139" y="345" font-family="Arial" font-size="15" fill="#4c4237">USEFUL RUG</text><rect x="480" y="160" width="142" height="68" fill="#6d8978" rx="4"/><text x="492" y="202" font-family="Arial" font-size="15" fill="#fff">WORK AREA</text><path d="M 616 425 L 540 425 L 540 340 L 365 340 L 365 245 L 370 165" fill="none" stroke="#ffffff" stroke-width="45" stroke-linecap="round" opacity=".78"/><path d="M 616 425 L 540 425 L 540 340 L 365 340 L 365 245 L 370 165" fill="none" stroke="#3c806c" stroke-width="4" stroke-dasharray="10 10"/><text x="445" y="326" font-family="Arial" font-size="15" fill="#275c48">CLEAR ROUTE</text><path d="M 670 405 L 675 405" stroke="#6d6558" stroke-width="7"/><text x="603" y="484" font-family="Arial" font-size="13" fill="#3c463e">ENTRY</text><g font-family="Arial" fill="#243c33"><rect x="735" y="136" width="18" height="18" fill="#3c806c"/><text x="768" y="151" font-size="18">Keep circulation clear</text><rect x="735" y="206" width="18" height="18" fill="#ccaf8d"/><text x="768" y="221" font-size="18">Use functional textiles</text><rect x="735" y="276" width="18" height="18" fill="#add6d7"/><text x="768" y="291" font-size="18">Protect natural light</text></g><text x="735" y="360" font-family="Arial" font-size="14" fill="#59685e">Adapt to actual room</text><text x="735" y="380" font-family="Arial" font-size="14" fill="#59685e">dimensions and openings.</text></svg>