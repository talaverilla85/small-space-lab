<title id="title">A three-step laundry workflow for a studio apartment</title>
<desc id="desc">Three illustrated zones for a portable hamper, a temporary drying rack and a folding surface. A clear walking route is shown separately. Conceptual schematic, not to scale.</desc>
<rect width="960" height="540" fill="#f5f7f5"/>
<text x="44" y="56" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1b4540">Laundry without a laundry room</text>
<text x="44" y="88" font-family="Arial,sans-serif" font-size="17" fill="#54726b">Three jobs. One repeatable route. No dedicated utility room required.</text>
