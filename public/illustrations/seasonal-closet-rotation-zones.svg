<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Three-zone wardrobe plan for a small apartment</title><desc id="d">Diagram: daily clothing is easiest to reach, transitional clothing stays nearby, and off-season reserve is on an upper shelf. Example rail: 80 cm total, 57 cm used, 23 cm remaining.</desc><rect width="960" height="520" rx="20" fill="#f4f6f1"/><g font-family="Arial,sans-serif"><text x="45" y="65" font-size="33" font-weight="bold" fill="#203f36">One closet, three access zones</text><rect x="48" y="104" width="510" height="348" rx="14" fill="white" stroke="#abc5b5" stroke-width="3"/><rect x="80" y="134" width="446" height="80" rx="10" fill="#d9e5dc"/><text x="303" y="178" font-size="23" text-anchor="middle" fill="#254e3c">C · OFF-SEASON RESERVE</text><rect x="80" y="235" width="300" height="180" rx="10" fill="#91b9a2"/><text x="230" y="323" font-size="25" font-weight="bold" text-anchor="middle" fill="#173c30">A · DAILY</text><rect x="391" y="235" width="135" height="180" rx="10" fill="#f3d39e"/><text x="459" y="312" font-size="17" text-anchor="middle" fill="#65461b">B · TRANSITION</text><rect x="586" y="104" width="326" height="348" rx="14" fill="white" stroke="#abc5b5" stroke-width="3"/><text x="616" y="152" font-size="22" font-weight="bold" fill="#203f36">Measure first</text><text x="616" y="195" font-size="19" fill="#456457">Example hanging rail:</text><text x="616" y="238" font-size="31" font-weight="bold" fill="#203f36">80 cm</text><rect x="616" y="260" width="250" height="36" rx="5" fill="#f3d39e"/><rect x="616" y="260" width="178" height="36" rx="5" fill="#91b9a2"/><text x="616" y="330" font-size="19" fill="#456457">57 cm used + 23 cm free</text><text x="616" y="370" font-size="17" fill="#456457">Also check depth, doors</text><text x="616" y="396" font-size="17" fill="#456457">and retrieval clearance.</text><text x="48" y="491" font-size="15" fill="#60796d">Original planning schematic · Example dimensions are hypothetical, not product specifications.</text></g></svg>