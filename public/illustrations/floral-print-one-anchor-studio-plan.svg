<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Two ways to use one floral print in a studio</title><desc id="desc">Option A uses a patterned sofa and plain bed. Option B uses a plain sofa and patterned bed. Both keep a clear walking route.</desc><rect width="960" height="520" rx="24" fill="#f5f2eb"/><text x="480" y="45" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#273f39" text-anchor="middle">ONE PATTERN ANCHOR, TWO OPTIONS</text><text x="480" y="73" font-family="Arial,sans-serif" font-size="14" fill="#576760" text-anchor="middle">A conceptual studio plan — not to scale</text><g font-family="Arial,sans-serif"><g transform="translate(35 105)"><rect width="425" height="345" rx="16" fill="#fff" stroke="#cbd6cb" stroke-width="2"/><text x="20" y="32" font-size="20" font-weight="700" fill="#273f39">A · Pattern on the sofa</text><rect x="22" y="52" width="380" height="265" rx="8" fill="#faf9f4" stroke="#9cae9f" stroke-width="3"/><rect x="42" y="78" width="135" height="73" rx="10" fill="#e6b9a4" stroke="#a76e5b" stroke-width="2"/><g fill="#a45655"><circle cx="63" cy="100" r="9"/><circle cx="104" cy="122" r="11"/><circle cx="148" cy="96" r="9"/></g><text x="109" y="175" font-size="14" fill="#273f39" text-anchor="middle">Floral sofa</text><rect x="245" y="75" width="132" height="99" rx="9" fill="#e2e5dd" stroke="#9ea99c" stroke-width="2"/><rect x="260" y="91" width="102" height="30" rx="4" fill="#f4f5f0"/><text x="311" y="196" font-size="14" fill="#273f39" text-anchor="middle">Plain bed</text><path d="M205 260H350" stroke="#4d806d" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 19"/><text x="276" y="292" font-size="13" fill="#47735e" text-anchor="middle">Clear route</text></g><g transform="translate(500 105)"><rect width="425" height="345" rx="16" fill="#fff" stroke="#cbd6cb" stroke-width="2"/><text x="20" y="32" font-size="20" font-weight="700" fill="#273f39">B · Pattern on the bed</text><rect x="22" y="52" width="380" height="265" rx="8" fill="#faf9f4" stroke="#9cae9f" stroke-width="3"/><rect x="42" y="78" width="135" height="73" rx="10" fill="#e2e5dd" stroke="#9ea99c" stroke-width="2"/><text x="109" y="175" font-size="14" fill="#273f39" text-anchor="middle">Plain sofa</text><rect x="245" y="75" width="132" height="99" rx="9" fill="#e6b9a4" stroke="#a76e5b" stroke-width="2"/><g fill="#a45655"><circle cx="265" cy="100" r="9"/><circle cx="313" cy="139" r="11"/><circle cx="354" cy="105" r="9"/></g><text x="311" y="196" font-size="14" fill="#273f39" text-anchor="middle">Floral bed</text><path d="M205 260H350" stroke="#4d806d" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 19"/><text x="276" y="292" font-size="13" fill="#47735e" text-anchor="middle">Clear route</text></g><text x="480" y="488" font-size="16" fill="#485b50" text-anchor="middle">Keep the footprint and daily route unchanged. Change the textile, not the layout.</text></g></svg>