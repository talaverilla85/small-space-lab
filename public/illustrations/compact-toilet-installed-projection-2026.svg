<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
<title id="t">Body depth versus installed toilet projection</title><desc id="d">Two hypothetical wall-to-front profiles in a 1450 millimeter room: older body 700 plus 20 gap equals 720; compact body 622 plus 20 gap equals 642, saving 78 millimeters.</desc>
<rect width="960" height="520" rx="22" fill="#f7f5ef"/><text x="48" y="58" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#193c40">Measure the installed envelope, not just the bowl</text>
<text x="48" y="91" font-family="Arial,sans-serif" font-size="16" fill="#506367">Illustrative 1,450 mm room depth • same 20 mm rear allowance in both comparisons</text>
<g font-family="Arial,sans-serif"><text x="48" y="151" font-size="20" font-weight="700" fill="#193c40">Previous comparable profile</text><text x="48" y="186" font-size="17" fill="#42595b">20 mm gap + 700 mm body = 720 mm</text>
<rect x="48" y="208" width="864" height="68" rx="10" fill="#dce9e7"/><rect x="48" y="208" width="12" height="68" fill="#33575b"/><rect x="60" y="208" width="12" height="68" fill="#efb78c"/><rect x="72" y="208" width="417" height="68" rx="6" fill="#447e83"/><text x="278" y="251" text-anchor="middle" font-size="18" fill="white" font-weight="700">720 mm installed</text><text x="697" y="251" text-anchor="middle" font-size="18" fill="#1b474a">730 mm ahead</text>
<text x="48" y="333" font-size="20" font-weight="700" fill="#193c40">New compact profile</text><text x="48" y="368" font-size="17" fill="#42595b">20 mm gap + 622 mm body = 642 mm</text>
<rect x="48" y="390" width="864" height="68" rx="10" fill="#dce9e7"/><rect x="48" y="390" width="12" height="68" fill="#33575b"/><rect x="60" y="390" width="12" height="68" fill="#efb78c"/><rect x="72" y="390" width="372" height="68" rx="6" fill="#447e83"/><text x="260" y="433" text-anchor="middle" font-size="18" fill="white" font-weight="700">642 mm installed</text><text x="677" y="433" text-anchor="middle" font-size="18" fill="#1b474a">808 mm ahead</text>
<text x="480" y="494" text-anchor="middle" font-size="16" font-weight="700" fill="#356b70">+78 mm geometric space • not a code-clearance guarantee</text></g></svg>