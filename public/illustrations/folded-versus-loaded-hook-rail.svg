<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Folded hook rail versus loaded hook rail in a narrow hallway</title><desc id="desc">Left panel shows a slim closed wall hook rail. Right panel shows the same rail with a bulky coat hanging into the walking route. Not to scale.</desc><rect width="960" height="520" rx="26" fill="#f4f1eb"/><text x="46" y="57" font-family="Arial,sans-serif" font-weight="700" font-size="29" fill="#24383b">The two-envelope test</text><text x="46" y="87" font-family="Arial,sans-serif" font-size="17" fill="#546464">Measure storage both empty and in real daily use</text><g transform="translate(42 122)"><rect width="426" height="329" rx="20" fill="#ffffff"/><text x="22" y="35" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#24383b">A. Empty rail</text><text x="22" y="61" font-family="Arial,sans-serif" font-size="14" fill="#56676b">Closed hook depth: 2.6 cm for IKEA PS 2026</text><rect x="32" y="93" width="46" height="182" rx="6" fill="#d7d2c6"/><text x="33" y="293" font-family="Arial,sans-serif" font-size="12" fill="#647376">WALL</text><rect x="78" y="149" width="13" height="76" rx="4" fill="#9a6d43"/><rect x="91" y="153" width="6" height="16" rx="3" fill="#d8a354"/><rect x="91" y="179" width="6" height="16" rx="3" fill="#d8a354"/><rect x="91" y="205" width="6" height="16" rx="3" fill="#d8a354"/><path d="M105 190 H354" stroke="#248a84" stroke-width="3" stroke-dasharray="8 6"/><text x="149" y="180" font-family="Arial,sans-serif" font-size="15" fill="#176a66">Unoccupied walkway</text><text x="22" y="314" font-family="Arial,sans-serif" font-size="13" fill="#647376">Rail is shallow only while the hooks are empty</text></g><g transform="translate(492 122)"><rect width="426" height="329" rx="20" fill="#ffffff"/><text x="22" y="35" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#24383b">B. Rail with a coat</text><text x="22" y="61" font-family="Arial,sans-serif" font-size="14" fill="#56676b">The coat, not the rail, sets the used depth</text><rect x="32" y="93" width="46" height="182" rx="6" fill="#d7d2c6"/><text x="33" y="293" font-family="Arial,sans-serif" font-size="12" fill="#647376">WALL</text><rect x="78" y="149" width="13" height="76" rx="4" fill="#9a6d43"/><path d="M91 175 L123 175" stroke="#d8a354" stroke-width="8" stroke-linecap="round"/><path d="M128 137 L165 149 L198 173 L181 195 L174 252 L121 252 L114 195 L97 173 L126 149 Z" fill="#ca765c" stroke="#b35f4c" stroke-width="3"/><path d="M147 138 L147 250" stroke="#f3b59b" stroke-width="3"/><path d="M88 270 H204" stroke="#cc6c55" stroke-width="3"/><path d="M88 264 V276 M204 264 V276" stroke="#cc6c55" stroke-width="3"/><text x="224" y="251" font-family="Arial,sans-serif" font-size="14" fill="#a55040">Measure actual</text><text x="224" y="269" font-family="Arial,sans-serif" font-size="14" fill="#a55040">coat projection</text><path d="M205 190 H356" stroke="#248a84" stroke-width="3" stroke-dasharray="8 6"/><text x="22" y="314" font-family="Arial,sans-serif" font-size="13" fill="#647376">Keep the required exit and access route clear</text></g><text x="480" y="489" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#647376">Original Small Space Planner diagram · conceptual, not to scale · October 2026</text></svg>