<text x="48" y="108" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#183e39">One little lamp. Three questions.</text>
<text x="48" y="142" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#4d6964">Choose a job, check the light, and give charging a home.</text>
